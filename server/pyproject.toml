[project]
name = "documentary-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "google-adk>=1.0.0",
    "python-dotenv",
    "litellm",
    "aiosqlite",
    "ag-ui-adk>=0.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "duckdb>=1.4.0,<1.5.0",
    "agentops>=0.4.21",
    "opentimelineio>=0.17.0",
    "soundfile",
    "numpy",
    "vastai",
    "b2sdk (>=2.10.4,<3.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
