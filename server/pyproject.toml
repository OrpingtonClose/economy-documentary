[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "strands_agents*",
    "api*",
    "fleet*",
    "agents*",
    "plugins*",
    "critique*",
    "previews*",
    "callbacks*",
    "dashboard*",
    "orchestrator*",
    "testing*",
    "tools*",
]

[project]
name = "documentary-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "python-dotenv",
    "litellm",
    "aiosqlite",
    "fastapi>=0.115.12",
    "uvicorn>=0.20.0",
    "duckdb>=1.4.0,<1.5.0",
    "agentops>=0.4.21",
    "opentimelineio>=0.17.0",
    "soundfile",
    "numpy",
    "vastai",
    "b2sdk (>=2.10.4,<3.0.0)",
    "pytest>=8.0",
    "strands-agents (==1.36.0)",
    "strands-agents-evals (==0.1.15)",
    "deepagents (==0.5.3)",
    "ag-ui-protocol (>=0.1.18)",
    "ag_ui_strands (>=0.1.7)",
    "mem0ai>=0.1.99",
]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=0.23,<2.0)",
]

[tool.pytest.ini_options]
testpaths = ["strands_agents/tests"]
pythonpath = ["."]
# ``auto`` mode lets ``async def test_...`` work without a per-test
# ``@pytest.mark.asyncio`` decorator. The event-stream tests need it;
# the rest of the suite is unaffected.
asyncio_mode = "auto"
