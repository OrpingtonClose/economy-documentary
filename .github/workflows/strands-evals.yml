name: Strands evals

on:
  pull_request:
    paths:
      - "server/strands_agents/**"
      - "server/pyproject.toml"
      - "server/poetry.lock"
      - ".github/workflows/strands-evals.yml"
  push:
    branches:
      - main
    paths:
      - "server/strands_agents/**"
      - "server/pyproject.toml"
      - "server/poetry.lock"
      - ".github/workflows/strands-evals.yml"

concurrency:
  group: strands-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Strands unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        # Poetry 2.x is required — this pyproject.toml uses PEP 621
        # ([project] only, no [tool.poetry] section).
        run: pipx install "poetry>=2.1,<3"

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-strands-${{ runner.os }}-py3.12-${{ hashFiles('server/poetry.lock') }}
          restore-keys: |
            poetry-strands-${{ runner.os }}-py3.12-

      - name: Install server dependencies with strands extra
        run: poetry install --no-root --with dev --with strands

      - name: Run strands_agents unit tests
        # No LLM keys: Phase-0 tests only check imports and spec files.
        # Per-component experiments land as subsequent matrix jobs.
        run: poetry run pytest strands_agents/tests/unit/ -v --tb=short

      - name: Run Tier-2 atomic-robustness suite (hermetic)
        id: tier2
        # Tier-2 has its own conftest that registers --tier2-report, so
        # it must be invoked on the tier2/ subpath explicitly.  The
        # reporter JSON feeds the per-component gate below.
        run: |
          set +e
          poetry run pytest strands_agents/tests/unit/tier2/ \
            --tier2-report=/tmp/tier2-report.json \
            -v --tb=short --maxfail=50
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "pytest_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pytest_failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Tier-2 per-component regression gate
        # Parses the reporter JSON and fails with per-component granularity
        # so the CI status page shows which components broke.  Hermetic-only
        # mode — live_fail counts only gate the nightly run.  Runs only when
        # the tier2 pytest step actually produced a report (skip if the job
        # failed earlier e.g. during poetry install).
        if: always() && steps.tier2.outputs.pytest_failed != ''
        run: |
          poetry run python -m strands_agents.tier2._gate \
            --report /tmp/tier2-report.json \
            --mode hermetic

      - name: Upload test artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strands-unit-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            server/strands_agents/evals/experiments/*.json
            /tmp/tier2-report.json
